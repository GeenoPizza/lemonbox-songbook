<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍋 Lemon Box Songbook</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f5f3ee;
    color:#191919;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

#app{
    max-width:900px;
    margin:auto;
    padding:32px 20px 70px;
}

header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:25px;
}

.logo{
    font-size:28px;
    font-weight:800;
    letter-spacing:-1px;
}

.logo span{
    color:#999;
    font-size:15px;
    font-weight:500;
    letter-spacing:0;
}

button{
    border:1px solid #ddd8cc;
    background:white;
    border-radius:999px;
    padding:10px 16px;
    font-weight:700;
    cursor:pointer;
}

.search{
    margin-bottom:18px;
}

.search input{
    width:100%;
    padding:15px 18px;
    border:1px solid #ddd8cc;
    border-radius:14px;
    background:white;
    font-size:16px;
    outline:none;
}

.songs{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.song{
    display:grid;
    grid-template-columns:30px 45px 1fr 30px;
    align-items:center;
    min-height:76px;
    padding:12px 18px;
    background:white;
    border:1px solid #e5e1d8;
    border-radius:17px;
    box-shadow:0 4px 16px rgba(0,0,0,.05);
    cursor:pointer;
    transition:.15s;
}

.song:hover{
    transform:translateY(-2px);
    box-shadow:0 9px 25px rgba(0,0,0,.09);
}

.drag{
    color:#aaa;
    opacity:0;
}

.editing .drag{
    opacity:1;
}

.num{
    color:#aaa;
    font-size:13px;
    font-weight:700;
}

.title{
    font-size:17px;
    font-weight:750;
}

.artist{
    margin-top:4px;
    color:#777;
    font-size:13px;
}

.arrow{
    color:#aaa;
    font-size:28px;
    text-align:right;
}

.hidden{
    display:none!important;
}

.reader{
    display:none;
}

.reader.active{
    display:block;
}

.back{
    margin-bottom:25px;
}

.reader h1{
    margin:0;
    font-size:42px;
    line-height:1.05;
    letter-spacing:-1.5px;
}

.reader .artist{
    font-size:17px;
    margin:8px 0 25px;
}

.lyrics-card{
    background:white;
    border:1px solid #e5e1d8;
    border-radius:20px;
    padding:40px;
    box-shadow:0 8px 30px rgba(0,0,0,.06);
}

.stanza{
    margin-bottom:30px;
}

.line{
    display:block;
    font-size:18px;
    line-height:1.65;
}

.loading{
    text-align:center;
    padding:40px;
    color:#777;
}

.error{
    padding:20px;
    background:#fff7d6;
    border-radius:14px;
}

.error a{
    display:inline-block;
    margin-top:12px;
    padding:10px 15px;
    background:#f4c542;
    border-radius:999px;
    color:#111;
    text-decoration:none;
    font-weight:700;
}

.nav{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.nav button{
    border-radius:13px;
    text-align:left;
}

.nav button:last-child{
    text-align:right;
}

@media(max-width:600px){

    #app{
        padding:20px 10px 50px;
    }

    header{
        align-items:center;
    }

    .logo{
        font-size:22px;
    }

    .logo span{
        font-size:13px;
    }

    .song{
        grid-template-columns:22px 34px 1fr 25px;
        min-height:68px;
        padding:10px 12px;
    }

    .title{
        font-size:15px;
    }

    .artist{
        font-size:12px;
    }

    .reader h1{
        font-size:30px;
    }

    .lyrics-card{
        padding:25px 18px;
    }

    .line{
        font-size:17px;
    }

    .nav{
        grid-template-columns:1fr;
    }

    .nav button:last-child{
        text-align:left;
    }
}
</style>
</head>

<body>

<div id="app">

<header>
    <div class="logo">
        🍋 Lemon Box
        <span>Songbook</span>
    </div>

    <button id="edit">✏️ Ordina</button>
</header>

<div class="search">
    <input id="search" type="search"
           placeholder="Cerca una canzone o un artista…">
</div>

<div id="list" class="songs"></div>

<div id="reader" class="reader">

    <button class="back" id="back">← Setlist</button>

    <h1 id="readerTitle"></h1>
    <div id="readerArtist" class="artist"></div>

    <div class="lyrics-card">
        <div id="lyrics">
            <div class="loading">Caricamento…</div>
        </div>
    </div>

    <div class="nav">
        <button id="prev">← Precedente</button>
        <button id="next">Successiva →</button>
    </div>

</div>

</div>

<script>

const SONGS=[

["All Star","Smash Mouth","all-star-smash-mouth/"],
["Say You'll Be There","Spice Girls","say-you-ll-be-there-spice-girls/"],
["Kiss Me","Sixpence None The Richer","kiss-me-sixpence-none-the-richer/"],
["Torn","Natalie Imbruglia","torn-natalie-imbruglia/"],
["Lovefool","The Cardigans","lovefool-the-cardigans/"],
["No Scrubs","TLC","no-scrubs-tlc/"],
["Let Me Love You","Mario","let-me-love-you-mario/"],
["Complicated","Avril Lavigne","complicated-avril-lavigne/"],
["As Long As You Love Me","Backstreet Boys","as-long-as-you-love-me-backstreet-boys/"],
["Fallin'","Alicia Keys","fallin-alicia-keys/"],
["You Get What You Give","New Radicals","you-get-what-you-give-new-radicals/"],
["She Will Be Loved","Maroon 5","she-will-be-loved-maroon-5/"],
["Iris","Goo Goo Dolls","iris-goo-goo-dolls/"],
["Ironic","Alanis Morissette","ironic-alanis-morissette/"],
["Bad Day","Daniel Powter","bad-day-daniel-powter/"],
["Cry Me a River","Justin Timberlake","cry-me-a-river-justin-timberlake/"],
["You Oughta Know","Alanis Morissette","you-oughta-know-alanis-morissette/"],
["Time of Your Life","Green Day","time-of-your-life-green-day/"],
["Don't Speak","No Doubt","don-t-speak-no-doubt/"],
["Unwritten","Natasha Bedingfield","unwritten-natasha-bedingfield/"],
["Lemon Tree","Fools Garden","lemon-tree-fools-garden/"],
["Sitcom Medley","","sitcom-medley/"],
["Get This Party Started","P!nk","get-this-party-started-p-nk/"],
["Sk8er Boi","Avril Lavigne","sk8er-boi-avril-lavigne/"],
["Wonderwall","Oasis","wonderwall-oasis/"],
["This Love","Maroon 5","this-love-maroon-5/"],
["Lose Yourself","Eminem","lose-yourself-eminem/"],
["All the Small Things","Blink 182","all-the-small-things-blink-182/"],
["Baby One More Time","Britney Spears","baby-one-more-time-britney-spears/"],
["Mmmbop","Hanson","mmmbop-hanson/"],
["I Want It That Way","Backstreet Boys","i-want-it-that-way-backstreet-boys/"],
["Wannabe","Spice Girls","wannabe-spice-girls/"]

].map((x,i)=>({
    id:String(i),
    title:x[0],
    artist:x[1],
    url:new URL(x[2],location.origin).href
}));

const KEY="lemonbox-order";

let songs=[...SONGS];
let current=-1;
let editing=false;

const list=document.getElementById("list");
const search=document.getElementById("search");

function escape(s){
    return String(s).replace(/[&<>"']/g,m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    }[m]));
}

function render(){

    const q=search.value.toLowerCase().trim();

    list.innerHTML="";

    songs
    .filter(s=>
        (s.title+" "+s.artist)
        .toLowerCase()
        .includes(q)
    )
    .forEach((s,i)=>{

        const el=document.createElement("div");

        el.className="song";

        el.innerHTML=`
            <span class="drag">☰</span>
            <span class="num">
                ${String(i+1).padStart(2,"0")}
            </span>
            <div>
                <div class="title">${escape(s.title)}</div>
                <div class="artist">${escape(s.artist)}</div>
            </div>
            <span class="arrow">›</span>
        `;

        el.onclick=()=>{
            if(!editing) openSong(i);
        };

        list.appendChild(el);

    });
}

async function openSong(i){

    current=i;

    const s=songs[i];

    list.classList.add("hidden");
    search.parentElement.classList.add("hidden");
    document.getElementById("edit").classList.add("hidden");

    const reader=document.getElementById("reader");

    reader.classList.add("active");

    document.getElementById("readerTitle").textContent=s.title;
    document.getElementById("readerArtist").textContent=s.artist;

    document.getElementById("lyrics").innerHTML=
        '<div class="loading">Caricamento del testo…</div>';

    try{

        const response=await fetch(s.url);

        if(!response.ok)
            throw new Error();

        const html=await response.text();

        const doc=new DOMParser()
            .parseFromString(html,"text/html");

        const text=doc.body.innerText||"";

        const lines=text.split("\n")
            .map(x=>x.trim())
            .filter(Boolean);

        let start=lines.findIndex(x=>
            x.toLowerCase()===s.title.toLowerCase()
        );

        if(start<0) start=0;

        let result=lines.slice(start+1);

        result=result.filter(x=>
            !/next song|back to home|privacy|informazioni legali/i.test(x)
        );

        renderLyrics(result);

    }catch(e){

        document.getElementById("lyrics").innerHTML=`
            <div class="error">
                <strong>Testo non disponibile qui.</strong>
                <br>
                Apri la pagina originale:
                <br>
                <a href="${s.url}" target="_blank">
                    Apri ${escape(s.title)} ↗
                </a>
            </div>
        `;

    }

    updateNav();

    window.scrollTo(0,0);
}

function renderLyrics(lines){

    const container=document.getElementById("lyrics");

    container.innerHTML="";

    let stanza=document.createElement("div");

    stanza.className="stanza";

    lines.forEach(line=>{

        const span=document.createElement("span");

        span.className="line";

        span.textContent=line;

        stanza.appendChild(span);

    });

    container.appendChild(stanza);
}

function updateNav(){

    document.getElementById("prev").disabled=current<=0;

    document.getElementById("next").disabled=
        current>=songs.length-1;
}

document.getElementById("back").onclick=()=>{

    document.getElementById("reader")
        .classList.remove("active");

    list.classList.remove("hidden");

    search.parentElement
        .classList.remove("hidden");

    document.getElementById("edit")
        .classList.remove("hidden");

};

document.getElementById("prev").onclick=()=>{
    if(current>0) openSong(current-1);
};

document.getElementById("next").onclick=()=>{
    if(current<songs.length-1) openSong(current+1);
};

document.getElementById("edit").onclick=()=>{

    editing=!editing;

    document.body.classList.toggle("editing",editing);

    document.getElementById("edit").textContent=
        editing ? "✓ Fine" : "✏️ Ordina";

    render();
};

search.oninput=render;

render();

</script>

</body>
</html>
