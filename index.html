<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemon Box Songbook</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f1e9;
  color:#252525;
  font-family:Arial,Helvetica,sans-serif;
}

#app{
  max-width:900px;
  margin:auto;
  padding:28px 18px 50px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.logo{
  font-size:28px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo span{color:#d7a900}

.adminBtn{
  border:1px solid #d8d1c2;
  background:white;
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer;
  font-size:14px;
}

.search{
  width:100%;
  padding:16px 18px;
  border:1px solid #ddd7ca;
  border-radius:14px;
  background:white;
  font-size:16px;
  outline:none;
  margin-bottom:18px;
}

.song{
  display:flex;
  align-items:center;
  gap:16px;
  background:white;
  border:1px solid #e4dfd4;
  border-radius:16px;
  padding:16px 18px;
  margin-bottom:10px;
  cursor:pointer;
  transition:.15s;
}

.song:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 18px rgba(0,0,0,.07);
}

.num{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#f1df87;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:bold;
  flex-shrink:0;
}

.info{flex:1}

.title{
  font-size:17px;
  font-weight:700;
}

.artist{
  margin-top:4px;
  color:#777;
  font-size:14px;
}

.arrow{
  font-size:22px;
  color:#aaa;
}

.reader{display:none}

.back{
  border:0;
  background:none;
  padding:0;
  margin-bottom:22px;
  font-size:15px;
  cursor:pointer;
  color:#666;
}

.reader h1{
  font-size:34px;
  margin:0;
  letter-spacing:-1px;
}

.reader .artist{
  font-size:17px;
  margin:7px 0 25px;
}

.lyrics{
  background:#fff;
  border:1px solid #e2ddd2;
  border-radius:20px;
  padding:30px;
  box-shadow:0 5px 25px rgba(0,0,0,.04);
}

.lyrics pre{
  white-space:pre-wrap;
  font-family:Arial,Helvetica,sans-serif;
  font-size:17px;
  line-height:1.65;
  margin:0;
}

.nav{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:18px;
}

.nav button{
  flex:1;
  padding:14px;
  border:1px solid #ddd6c8;
  border-radius:12px;
  background:white;
  cursor:pointer;
  font-size:15px;
}

.empty{
  padding:40px;
  text-align:center;
  color:#777;
}

/* ADMIN */

.adminPanel{
  display:none;
}

.adminTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.adminTop h2{
  margin:0;
  font-size:25px;
}

.adminActions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.adminActions button,
.addBox button{
  border:0;
  background:#252525;
  color:white;
  border-radius:10px;
  padding:11px 14px;
  cursor:pointer;
}

.adminSong{
  display:flex;
  align-items:center;
  gap:12px;
  background:white;
  border:1px solid #ddd7ca;
  border-radius:14px;
  padding:12px;
  margin-bottom:8px;
  cursor:grab;
}

.adminSong.dragging{
  opacity:.45;
}

.drag{
  font-size:20px;
  color:#aaa;
  cursor:grab;
}

.adminSongInfo{
  flex:1;
}

.adminSongTitle{
  font-weight:bold;
}

.adminSongArtist{
  color:#777;
  font-size:13px;
  margin-top:3px;
}

.adminIcon{
  border:0;
  background:#f1eee7;
  border-radius:8px;
  padding:8px;
  cursor:pointer;
  font-size:16px;
}

.adminIcon.hidden{
  opacity:.4;
}

.addBox{
  background:white;
  border:1px solid #ddd7ca;
  border-radius:16px;
  padding:18px;
  margin-top:20px;
}

.addBox h3{
  margin-top:0;
}

.addBox input,
.addBox textarea{
  width:100%;
  border:1px solid #ddd7ca;
  border-radius:9px;
  padding:11px;
  margin-bottom:9px;
  font:inherit;
}

.addBox textarea{
  min-height:180px;
  resize:vertical;
}

.status{
  margin-top:12px;
  font-size:14px;
  color:#666;
}

@media(max-width:600px){
  #app{padding:20px 12px 40px}
  .logo{font-size:24px}
  .reader h1{font-size:28px}
  .lyrics{padding:22px}
  .lyrics pre{font-size:16px}
}
</style>
</head>

<body>

<div id="app">

<header>
  <div class="logo">🍋 Lemon Box <span>Songbook</span></div>
  <button class="adminBtn" onclick="adminLogin()">✏️ Modifica</button>
</header>

<section id="listView">

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Cerca una canzone..."
  >

  <div id="songList"></div>

</section>

<section id="reader" class="reader">

  <button class="back" onclick="showList()">← Tutte le canzoni</button>

  <h1 id="readerTitle"></h1>
  <div id="readerArtist" class="artist"></div>

  <div class="lyrics">
    <pre id="lyricsText">Caricamento...</pre>
  </div>

  <div class="nav">
    <button onclick="previousSong()">← Previous</button>
    <button onclick="nextSong()">Next →</button>
  </div>

</section>

<section id="adminPanel" class="adminPanel">

  <div class="adminTop">

    <h2>✏️ Modifica Songbook</h2>

  <div class="adminActions">
  <button id="saveButton" onclick="saveChanges()">💾 Salva</button>
  <button onclick="exitAdmin()">Esci</button>
</div>

  <div id="adminList"></div>

  <div class="addBox">

    <h3>➕ Aggiungi canzone</h3>

    <input id="newTitle" placeholder="Titolo">

    <input id="newArtist" placeholder="Artista">

    <textarea id="newText" placeholder="Testo della canzone"></textarea>

    <button onclick="addSong()">Aggiungi canzone</button>

    <div id="status" class="status"></div>

  </div>

</section>

</div>

<script>

const API_URL = "https://lemonbox-songbook.vercel.app/api/update";

let SONGS = [];
let currentIndex = 0;
let adminPassword = null;

const listView = document.getElementById("listView");
const reader = document.getElementById("reader");
const adminPanel = document.getElementById("adminPanel");
const songList = document.getElementById("songList");
const adminList = document.getElementById("adminList");
const search = document.getElementById("search");

async function loadSongs(){

  try{

    const response = await fetch("songs.json?t=" + Date.now());

    if(!response.ok){
      throw new Error("songs.json non disponibile");
    }

    SONGS = await response.json();

    renderSongs(SONGS);

  }catch(error){

    songList.innerHTML = `
      <div class="empty">
        Impossibile caricare il Songbook.
      </div>
    `;

    console.error(error);
  }
}

function renderSongs(songs){

  songList.innerHTML = "";

  const visibleSongs = songs.filter(song => song.visible !== false);

  if(!visibleSongs.length){
    songList.innerHTML = `
      <div class="empty">
        Nessuna canzone trovata.
      </div>
    `;
    return;
  }

  visibleSongs.forEach(song => {

    const realIndex = SONGS.indexOf(song);

    const el = document.createElement("div");

    el.className = "song";

    el.innerHTML = `
      <div class="num">
        ${String(realIndex+1).padStart(2,"0")}
      </div>

      <div class="info">
        <div class="title">${escapeHTML(song.title)}</div>
        <div class="artist">${escapeHTML(song.artist || "")}</div>
      </div>

      <div class="arrow">›</div>
    `;

    el.onclick = () => openSong(realIndex);

    songList.appendChild(el);

  });
}

function openSong(index){

  currentIndex = index;

  const song = SONGS[index];

  document.getElementById("readerTitle").textContent = song.title;
  document.getElementById("readerArtist").textContent = song.artist || "";
  document.getElementById("lyricsText").textContent =
    song.text || "Testo non disponibile.";

  listView.style.display = "none";
  reader.style.display = "block";
  adminPanel.style.display = "none";

  window.scrollTo(0,0);
}

function showList(){

  reader.style.display = "none";
  adminPanel.style.display = "none";
  listView.style.display = "block";

  window.scrollTo(0,0);
}

function nextSong(){

  let i = currentIndex + 1;

  while(i < SONGS.length){

    if(SONGS[i].visible !== false){
      openSong(i);
      return;
    }

    i++;
  }
}

function previousSong(){

  let i = currentIndex - 1;

  while(i >= 0){

    if(SONGS[i].visible !== false){
      openSong(i);
      return;
    }

    i--;
  }
}

search.addEventListener("input", () => {

  const q = search.value.toLowerCase().trim();

  renderSongs(
    SONGS.filter(song =>
      song.title.toLowerCase().includes(q) ||
      (song.artist || "").toLowerCase().includes(q)
    )
  );

});

async function adminLogin(){

  const password = prompt("Password amministratore:");

  if(!password){
    return;
  }

  try {

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "login",
        password: password
      })
    });

    const data = await response.json();

    if(!response.ok || !data.success){
      alert("Password non valida.");
      return;
    }

    adminPassword = password;

    listView.style.display = "none";
    reader.style.display = "none";
    adminPanel.style.display = "block";

    renderAdmin();

    window.scrollTo(0,0);

  } catch(error) {

    alert("Errore di connessione al server.");
    console.error(error);

  }
}

function exitAdmin(){

  adminPassword = null;

  adminPanel.style.display = "none";
  listView.style.display = "block";

  renderSongs(SONGS);

  window.scrollTo(0,0);
}

function renderAdmin(){

  adminList.innerHTML = "";

  SONGS.forEach((song,index)=>{

    const el = document.createElement("div");

    el.className = "adminSong";
    el.draggable = true;
    el.dataset.index = index;

    el.innerHTML = `

      <div class="drag">☰</div>

      <div class="adminSongInfo">
        <div class="adminSongTitle">
          ${escapeHTML(song.title)}
        </div>

        <div class="adminSongArtist">
          ${escapeHTML(song.artist || "")}
        </div>
      </div>

      <button
        class="adminIcon ${song.visible === false ? "hidden" : ""}"
        title="Mostra/nascondi"
        onclick="toggleVisibility(${index})">
        ${song.visible === false ? "🙈" : "👁️"}
      </button>

      <button
        class="adminIcon"
        title="Elimina"
        onclick="deleteSong(${index})">
        🗑️
      </button>
    `;

    el.addEventListener("dragstart", () => {
      el.classList.add("dragging");
    });

    el.addEventListener("dragend", () => {
      el.classList.remove("dragging");
      updateOrder();
    });

    el.addEventListener("dragover", e => {
      e.preventDefault();

      const dragging = adminList.querySelector(".dragging");

      if(!dragging || dragging === el){
        return;
      }

      const rect = el.getBoundingClientRect();
      const after = e.clientY > rect.top + rect.height / 2;

      if(after){
        el.after(dragging);
      }else{
        el.before(dragging);
      }
    });

    adminList.appendChild(el);

  });
}

function updateOrder(){

  const elements = [...adminList.children];

  const reordered = elements.map(el =>
    SONGS[Number(el.dataset.index)]
  );

  SONGS = reordered;

  renderAdmin();
}

function toggleVisibility(index){

  SONGS[index].visible = SONGS[index].visible === false;

  renderAdmin();
}

function deleteSong(index){

  const song = SONGS[index];

  if(!confirm(`Eliminare "${song.title}" dal Songbook?`)){
    return;
  }

  SONGS.splice(index,1);

  renderAdmin();
}

function addSong(){

  const title = document.getElementById("newTitle").value.trim();
  const artist = document.getElementById("newArtist").value.trim();
  const text = document.getElementById("newText").value.trim();

  if(!title){
    alert("Inserisci almeno il titolo.");
    return;
  }

  SONGS.push({
    title,
    artist,
    text,
    url:"",
    visible:true
  });

  document.getElementById("newTitle").value = "";
  document.getElementById("newArtist").value = "";
  document.getElementById("newText").value = "";

  renderAdmin();

  document.getElementById("status").textContent =
    "Canzone aggiunta. Ricordati di premere Salva.";
}

async function saveChanges(){

  if(!adminPassword){
    alert("Sessione amministratore non valida.");
    return;
  }

  const status = document.getElementById("status");
  const saveButton = document.getElementById("saveButton");

  saveButton.disabled = true;
  saveButton.textContent = "⏳ Salvataggio...";
  status.textContent = "Salvataggio in corso...";

  try{

    const response = await fetch(API_URL,{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        action:"save",
        password:adminPassword,
        songs:SONGS
      })

    });

    const result = await response.json();

    if(!response.ok){
      throw new Error(result.error || "Errore di salvataggio");
    }

    saveButton.textContent = "✓ Salvato";
    status.textContent =
      "Modifiche salvate. Attendi qualche secondo prima di uscire.";

    setTimeout(() => {
      saveButton.textContent = "💾 Salva";
      saveButton.disabled = false;
    }, 3000);

  }catch(error){

    saveButton.textContent = "❌ Errore";
    status.textContent =
      "Errore: " + error.message;

    console.error(error);

    setTimeout(() => {
      saveButton.textContent = "💾 Salva";
      saveButton.disabled = false;
    }, 3000);
  }
}

function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

loadSongs();

</script>

</body>
</html>
