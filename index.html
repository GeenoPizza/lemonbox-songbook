<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemon Box Songbook</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f1e9;
  color:#252525;
  font-family:Arial,Helvetica,sans-serif;
}

#app{
  max-width:900px;
  margin:auto;
  padding:28px 18px 50px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.logo{
  font-size:28px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo span{
  color:#d7a900;
}

.search{
  width:100%;
  padding:16px 18px;
  border:1px solid #ddd7ca;
  border-radius:14px;
  background:white;
  font-size:16px;
  outline:none;
  margin-bottom:18px;
}

.song{
  display:flex;
  align-items:center;
  gap:16px;
  background:white;
  border:1px solid #e4dfd4;
  border-radius:16px;
  padding:16px 18px;
  margin-bottom:10px;
  cursor:pointer;
  transition:.15s;
}

.song:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 18px rgba(0,0,0,.07);
}

.num{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#f1df87;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:bold;
  flex-shrink:0;
}

.info{
  flex:1;
}

.title{
  font-size:17px;
  font-weight:700;
}

.artist{
  margin-top:4px;
  color:#777;
  font-size:14px;
}

.arrow{
  font-size:22px;
  color:#aaa;
}

.reader{
  display:none;
}

.back{
  border:0;
  background:none;
  padding:0;
  margin-bottom:22px;
  font-size:15px;
  cursor:pointer;
  color:#666;
}

.reader h1{
  font-size:34px;
  margin:0;
  letter-spacing:-1px;
}

.reader .artist{
  font-size:17px;
  margin:7px 0 25px;
}

.lyrics{
  background:#fff;
  border:1px solid #e2ddd2;
  border-radius:20px;
  padding:30px;
  box-shadow:0 5px 25px rgba(0,0,0,.04);
}

.lyrics pre{
  white-space:pre-wrap;
  font-family:Arial,Helvetica,sans-serif;
  font-size:17px;
  line-height:1.65;
  margin:0;
}

.nav{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:18px;
}

.nav button{
  flex:1;
  padding:14px;
  border:1px solid #ddd6c8;
  border-radius:12px;
  background:white;
  cursor:pointer;
  font-size:15px;
}

.empty{
  padding:40px;
  text-align:center;
  color:#777;
}

@media(max-width:600px){
  #app{padding:20px 12px 40px}
  .logo{font-size:24px}
  .reader h1{font-size:28px}
  .lyrics{padding:22px}
  .lyrics pre{font-size:16px}
}
</style>
</head>

<body>

<div id="app">

  <header>
    <div class="logo">🍋 Lemon Box <span>Songbook</span></div>
  </header>

  <section id="listView">
    <input
      id="search"
      class="search"
      type="search"
      placeholder="Cerca una canzone..."
    >

    <div id="songList"></div>
  </section>

  <section id="reader" class="reader">
    <button class="back" onclick="showList()">← Tutte le canzoni</button>

    <h1 id="readerTitle"></h1>
    <div id="readerArtist" class="artist"></div>

    <div class="lyrics">
      <pre id="lyricsText">Caricamento...</pre>
    </div>

    <div class="nav">
      <button onclick="previousSong()">← Precedente</button>
      <button onclick="nextSong()">Successiva →</button>
    </div>
  </section>

</div>

<script>
let SONGS = [];
let currentIndex = 0;

const listView = document.getElementById("listView");
const reader = document.getElementById("reader");
const songList = document.getElementById("songList");
const search = document.getElementById("search");

async function loadSongs(){

  try{

    const response = await fetch("songs.json");

    if(!response.ok){
      throw new Error("songs.json non disponibile");
    }

    SONGS = await response.json();

    renderSongs(SONGS);

  }catch(error){

    songList.innerHTML = `
      <div class="empty">
        Impossibile caricare il Songbook.
      </div>
    `;

    console.error(error);
  }
}

function renderSongs(songs){

  songList.innerHTML = "";

  if(!songs.length){
    songList.innerHTML = `
      <div class="empty">
        Nessuna canzone trovata.
      </div>
    `;
    return;
  }

  songs.forEach((song, index)=>{

    const realIndex = SONGS.indexOf(song);

    const el = document.createElement("div");
    el.className = "song";

    el.innerHTML = `
      <div class="num">${String(realIndex+1).padStart(2,"0")}</div>

      <div class="info">
        <div class="title">${escapeHTML(song.title)}</div>
        <div class="artist">${escapeHTML(song.artist || "")}</div>
      </div>

      <div class="arrow">›</div>
    `;

    el.onclick = ()=>openSong(realIndex);

    songList.appendChild(el);
  });
}

function openSong(index){

  currentIndex = index;

  const song = SONGS[index];

  document.getElementById("readerTitle").textContent = song.title;
  document.getElementById("readerArtist").textContent = song.artist || "";
  document.getElementById("lyricsText").textContent =
    song.text || "Testo non disponibile.";

  listView.style.display = "none";
  reader.style.display = "block";

  window.scrollTo(0,0);
}

function showList(){

  reader.style.display = "none";
  listView.style.display = "block";

  window.scrollTo(0,0);
}

function nextSong(){

  if(currentIndex < SONGS.length - 1){
    openSong(currentIndex + 1);
  }
}

function previousSong(){

  if(currentIndex > 0){
    openSong(currentIndex - 1);
  }
}

search.addEventListener("input", ()=>{

  const q = search.value.toLowerCase().trim();

  renderSongs(
    SONGS.filter(song =>
      song.title.toLowerCase().includes(q) ||
      (song.artist || "").toLowerCase().includes(q)
    )
  );
});

function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

loadSongs();
</script>

</body>
</html>
