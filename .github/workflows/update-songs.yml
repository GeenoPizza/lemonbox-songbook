name: Build Lemon Box Songbook

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build songs.json
        run: |
          python -m pip install requests beautifulsoup4

          cat > build_songs.py <<'PY'
          import json
          import re
          import requests
          from bs4 import BeautifulSoup

          SONGS = [
              ("All Star", "Smash Mouth", "all-star-smash-mouth/"),
              ("Say You'll Be There", "Spice Girls", "say-you-ll-be-there-spice-girls/"),
              ("Kiss Me", "Sixpence None The Richer", "kiss-me-sixpence-none-the-richer/"),
              ("Torn", "Natalie Imbruglia", "torn-natalie-imbruglia/"),
              ("Lovefool", "The Cardigans", "lovefool-the-cardigans/"),
              ("No Scrubs", "TLC", "no-scrubs-tlc/"),
              ("Let Me Love You", "Mario", "let-me-love-you-mario/"),
              ("Complicated", "Avril Lavigne", "complicated-avril-lavigne/"),
              ("As Long As You Love Me", "Backstreet Boys", "as-long-as-you-love-me-backstreet-boys/"),
              ("Fallin'", "Alicia Keys", "fallin-alicia-keys/"),
              ("You Get What You Give", "New Radicals", "you-get-what-you-give-new-radicals/"),
              ("She Will Be Loved", "Maroon 5", "she-will-be-loved-maroon-5/"),
              ("Iris", "Goo Goo Dolls", "iris-goo-goo-dolls/"),
              ("Ironic", "Alanis Morissette", "ironic-alanis-morissette/"),
              ("Bad Day", "Daniel Powter", "bad-day-daniel-powter/"),
              ("Cry Me a River", "Justin Timberlake", "cry-me-a-river-justin-timberlake/"),
              ("You Oughta Know", "Alanis Morissette", "you-oughta-know-alanis-morissette/"),
              ("Time of Your Life", "Green Day", "time-of-your-life-green-day/"),
              ("Don't Speak", "No Doubt", "don-t-speak-no-doubt/"),
              ("Unwritten", "Natasha Bedingfield", "unwritten-natasha-bedingfield/"),
              ("Lemon Tree", "Fools Garden", "lemon-tree-fools-garden/"),
              ("Sitcom Medley", "", "sitcom-medley/"),
              ("Get This Party Started", "P!nk", "get-this-party-started-p-nk/"),
              ("Sk8er Boi", "Avril Lavigne", "sk8er-boi-avril-lavigne/"),
              ("Wonderwall", "Oasis", "wonderwall-oasis/"),
              ("This Love", "Maroon 5", "this-love-maroon-5/"),
              ("Lose Yourself", "Eminem", "lose-yourself-eminem/"),
              ("All the Small Things", "Blink 182", "all-the-small-things-blink-182/"),
              ("Baby One More Time", "Britney Spears", "baby-one-more-time-britney-spears/"),
              ("Mmmbop", "Hanson", "mmmbop-hanson/"),
              ("I Want It That Way", "Backstreet Boys", "i-want-it-that-way-backstreet-boys/"),
              ("Wannabe", "Spice Girls", "wannabe-spice-girls/")
          ]

          BASE = "https://lemonbox-singwithus.jimdofree.com/"

          def get_song(song):
              title, artist, path = song
              url = BASE + path

              r = requests.get(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"},
                  timeout=20
              )
              r.raise_for_status()

              soup = BeautifulSoup(r.text, "html.parser")

              # Rimuove elementi che non fanno parte del testo
              for tag in soup(["script", "style", "nav", "header", "footer"]):
                  tag.decompose()

              text = soup.get_text("\n", strip=True)
              lines = [x.strip() for x in text.splitlines() if x.strip()]

              # Trova il titolo della canzone
              start = None
              for i, line in enumerate(lines):
                  if title.lower() in line.lower():
                      start = i + 1
                      break

              if start is None:
                  start = 0

              # Tutto ciò che viene dopo questi elementi non è testo della canzone
              end = len(lines)

              for i in range(start, len(lines)):
                  low = lines[i].lower()
                  if (
                      "next song" in low
                      or "back to song list" in low
                      or "are you having fun" in low
                  ):
                      end = i
                      break

              lyrics = lines[start:end]

              # Elimina eventuali righe vuote duplicate
              clean = []
              for line in lyrics:
                  if line and (not clean or line != clean[-1]):
                      clean.append(line)

              return {
                  "title": title,
                  "artist": artist,
                  "url": url,
                  "text": "\n".join(clean)
              }

          output = []

          for song in SONGS:
              print("Downloading:", song[0])
              try:
                  output.append(get_song(song))
              except Exception as e:
                  print("ERROR:", song[0], e)
                  output.append({
                      "title": song[0],
                      "artist": song[1],
                      "url": BASE + song[2],
                      "text": ""
                  })

          with open("songs.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("Done:", len(output), "songs")
          PY

          python build_songs.py

      - name: Save songs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs.json
          git diff --cached --quiet || git commit -m "Update song texts"
          git push
