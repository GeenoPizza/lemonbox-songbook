<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lemon Box · Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 35px;
    }

    .panel {
      background: #1b1b1b;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 24px;
    }

    input {
      width: 100%;
      max-width: 400px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .login-button {
      background: #5de0bb;
      color: #111;
    }

    .error {
      color: #e58b8b;
      margin-top: 15px;
    }

    #adminArea {
      display: none;
    }

    .song {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      margin-bottom: 8px;
      background: #242424;
      border-radius: 10px;
    }

    .handle {
      color: #777;
      font-size: 20px;
      width: 25px;
      text-align: center;
    }

    .song-title {
      flex: 1;
      font-size: 17px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      padding: 5px 9px;
      border-radius: 20px;
      background: #163b32;
      color: #5de0bb;
    }

    .status.hidden {
      background: #3b2525;
      color: #e58b8b;
    }

    .toggle {
      background: #333;
      color: white;
    }

    .delete {
      background: #4a2424;
      color: #ffb0b0;
    }

    .empty {
      color: #777;
      padding: 30px 0;
      text-align: center;
    }

    #message {
      margin-top: 20px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🍋 Lemon Box · Admin</h1>

    <div class="subtitle">
      Gestione del Songbook
    </div>

    <div class="panel">

      <div id="loginArea">

        <input
          id="password"
          type="password"
          placeholder="Password admin"
        >

        <br>

        <button
          class="login-button"
          onclick="login()"
        >
          Accedi
        </button>

        <div id="loginError" class="error"></div>

      </div>


      <div id="adminArea">

        <div id="songList">
          <div class="empty">
            Caricamento...
          </div>
        </div>

        <div id="message"></div>

      </div>

    </div>

  </div>


  <script>

    const SONGS_URL =
      "https://raw.githubusercontent.com/GeenoPizza/lemonbox-songbook/main/songs.json";

    const API_URL =
      "https://lemonbox-songbook.vercel.app/api/update";

    let password = "";
    let songs = [];


    async function login() {

      const input =
        document.getElementById("password");

      const error =
        document.getElementById("loginError");

      password = input.value;

      error.textContent = "";

      if (!password) {
        error.textContent = "Inserisci la password.";
        return;
      }

      try {

        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: "login",
            password: password
          })
        });

        const data = await response.json();

        if (!data.success) {
          throw new Error(
            data.error || "Password non valida."
          );
        }

        document.getElementById("loginArea").style.display =
          "none";

        document.getElementById("adminArea").style.display =
          "block";

        loadSongs();

      } catch (error) {

        error = String(error.message || error);

        document.getElementById("loginError").textContent =
          error;

      }

    }


    async function loadSongs() {

      const container =
        document.getElementById("songList");

      try {

        const response =
          await fetch(
            SONGS_URL + "?t=" + Date.now(),
            {
              cache: "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status
          );
        }

        songs = await response.json();

        renderSongs();

      } catch (error) {

        container.innerHTML =
          '<div class="empty">' +
          'Errore nel caricamento: ' +
          error.message +
          '</div>';

      }

    }


    function renderSongs() {

      const container =
        document.getElementById("songList");

      container.innerHTML = "";

      songs.forEach(function(song, index) {

        const row =
          document.createElement("div");

        row.className = "song";

        const handle =
          document.createElement("div");

        handle.className = "handle";
        handle.textContent = "☰";

        const title =
          document.createElement("div");

        title.className = "song-title";
        title.textContent =
          song.title || "Senza titolo";

        const status =
          document.createElement("div");

        if (song.visible === false) {

          status.className = "status hidden";
          status.textContent = "Nascosta";

        } else {

          status.className = "status";
          status.textContent = "Visibile";

        }

        const toggle =
          document.createElement("button");

        toggle.className = "toggle";

        toggle.textContent =
          song.visible === false
            ? "Mostra"
            : "Nascondi";

        toggle.onclick = function() {

          song.visible =
            song.visible === false;

          renderSongs();

        };


        const deleteButton =
          document.createElement("button");

        deleteButton.className = "delete";
        deleteButton.textContent = "Elimina";

        deleteButton.onclick = function() {

          if (
            !confirm(
              'Eliminare "' +
              (song.title || "questa canzone") +
              '"?'
            )
          ) {
            return;
          }

          songs.splice(index, 1);

          renderSongs();

        };


        row.appendChild(handle);
        row.appendChild(title);
        row.appendChild(status);
        row.appendChild(toggle);
        row.appendChild(deleteButton);

        container.appendChild(row);

      });

    }

  </script>

</body>
</html>
